    fov: 55
    camera:
      keys:
        - {at: 0, position: [170, -40, 62], look_at: [60, 0, 47]}
    tracks:
      hiro:
        - {at: 0, play: neutral, duration: 2.1}
  - duration: 4
    fov: 55
    camera:
      keys:
        - {at: 0, position: [-170, -90, 62], look_at: [0, 0, 47]}
    tracks:
      hiro:
        - {at: 0, turn: [0, 180, 0], duration: 0.5}
        - {at: 0.6, move_to: entry, mode: run, clip: run, duration: 1.8}
